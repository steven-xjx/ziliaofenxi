年清明假期3天，Y省接待游客2","kaodian":"文字资料"},{"q":128,"question":"单选题\n\n将Y省2024年清明假期、“五一”假期和端午假期日均实现旅游收入从高到低排列，以下正确的是：\n\nA\n\n“五一”、端午、清明\n\nB\n\n清明、“五一”、端午\n\nC\n\n“五一”、清明、端午\n\nD\n\n清明、端午、“五一”","answer":"C","solution":"根据题干“将Y省2024年······日均······”，结合材料时间为2025年，可判定本题为基期平均数问题。定位文字材料第一、二、三段可得：2025年清明假期3天······实现旅游收入","kaodian":"基期平均数"},{"q":129,"question":"单选题\n\n2025年清明假期、“五一”假期和端午假期Y省接待的游客中，平均每万人次中有多少人次前往纳入监测的13家红色旅游经典景区旅游？\n\nA\n\n超过300人次\n\nB\n\n200~300人次之间\n\nC\n\n100~200人次之间\n\nD\n\n不到100人次","answer":"B","solution":"根据题干“2025年······平均每万人次······”，结合材料时间为2025年，可判定本题为现期平均数问题。定位文字材料第一、二、三段可得2025年清明假期、“五一”假期、端午假期Y省接待游客人次数以及纳入监测的13家红色旅游经典景区接待游客人次数。则题干所求人次，在B项范围内。\n\n故正确答案为B。","kaodian":"现期平均数"},{"q":130,"question":"单选题\n\n以下柱状图反映了2025年清明假期、“五一”假期和端午假期，Y省接待游客哪一指标的变化情况（横轴位置表示数值为0）？\n\nA\n\n纳入监测的13家红色旅游经典景区日均接待游客数同比增量\n\nB\n\n纳入监测的13家红色旅游经典景区日均接待游客数量\n\nC\n\n4A级及以上景区日均接待游客数同比增量\n\nD\n\n4A级及以上景区日均接待游客数量","answer":"A","solution":"根据题干“以下柱状图反映了2025年······Y省接待游客哪一指标的变化情况······”，结合选项中涉及日均接待游客数，可判定本题为平均数问题。定位材料第一、二、三段可得2025年清明假期、“五一”假期和端午假期的天数、Y省接待游客各指标数据和同比增长率。根据公式：平均数，增长量，可得Y省接待游客各指标的数据情况如下：\n\nA项，纳入监测的13家红色旅游经典景区日均接待游客数同比增量：清明假期，万人次；“五一”假期，万人次；端午假期，万人次，符合柱状图变化趋势，当选；\n\nB项，纳入监测的13家红色旅游经典景区日均接待游客数量：清明假期，万人次；端午假期，万人次。清明假期日均接待游客数量与端午假期几乎相等，不符合柱状图变化趋势，排除；\n\nC项，4A级及以上景区日均接待游客数同比增量：清明假期，万人次；“五一”假期，人次；端午假期，万人次。“五一”假期同比增量>端午假期同比增量，不符合柱状图变化趋势，排除；\n\nD项，4A级及以上景区日均接待游客数量：清明假期，万人次；“五一”假期，万人次；端午假期，万人次。“五一”假期日均接待游客数量>端午假期日均接待游客数量，不符合柱状图变化趋势，排除。\n\n故正确答案为A。","kaodian":"现期平均数"}];
