<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资料分析题型分类汇总</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#1a73e8,#1557b0);color:#fff;padding:18px 30px;text-align:center}
.header h1{font-size:22px;font-weight:600}
.header p{font-size:13px;opacity:.85;margin-top:4px}
.container{max-width:1200px;margin:0 auto;padding:16px 20px}
.cat-tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cat-tab{padding:6px 18px;border-radius:20px;cursor:pointer;font-size:13px;border:1.5px solid #d0d5dd;background:#fff;color:#666;transition:all .2s;user-select:none}
.cat-tab:hover{border-color:#1a73e8;color:#1a73e8}
.cat-tab.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.year-group{margin-bottom:6px}
.year-label{font-size:12px;color:#999;margin:0 4px 6px;font-weight:600}
.paper-tabs{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap}
.paper-tab{padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12.5px;border:1.5px solid #e0e0e0;background:#fff;transition:all .2s;user-select:none}
.paper-tab:hover{background:#e8f0fe;border-color:#1a73e8}
.paper-tab.active{background:#1a73e8;color:#fff;border-color:#1a73e8;font-weight:600}
.paper-title{font-size:18px;font-weight:700;color:#1a73e8;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #e8f0fe;display:flex;align-items:center;gap:12px}
.paper-title span{color:#999;font-weight:400;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.card{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e8ecf0;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:#1a73e8;transform:translateY(-1px)}
.card-num{width:30px;height:30px;border-radius:8px;background:#e8f0fe;color:#1a73e8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.card-text{font-size:13.5px;color:#444;line-height:1.4}
.stats{background:#fff;border-radius:10px;padding:14px 18px;margin-bottom:14px;border:1px solid #e8ecf0;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.stat-item{display:flex;align-items:center;gap:6px;font-size:14px;color:#666}
.stat-item strong{color:#1a73e8;font-size:20px}
.stat-item .tag{background:#e8f0fe;padding:2px 8px;border-radius:10px;font-size:12px;margin:0 1px}
.search-box{margin-bottom:14px}
.search-box input{width:100%;padding:10px 16px;border:1.5px solid #d0d5dd;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:#1a73e8}
.card.hidden{display:none}
.empty{text-align:center;padding:60px;color:#999;font-size:15px}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;padding:30px;position:relative}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;cursor:pointer;color:#999;border:none;background:none;line-height:1}
.modal-close:hover{color:#333}
.modal-header{font-size:18px;font-weight:700;color:#1a73e8;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #e8f0fe}
.modal-info{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.modal-tag{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600}
.tag-type{background:#e8f0fe;color:#1a73e8}
.tag-answer{background:#e6f7e6;color:#1c8a2e}
.modal-section{margin-bottom:16px}
.modal-section h3{font-size:15px;color:#333;margin-bottom:8px;font-weight:600}
.modal-section p{font-size:14px;color:#555;line-height:1.8}
.modal-link{display:inline-block;margin-top:16px;padding:10px 24px;background:#1a73e8;color:#fff;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500;transition:all .2s}
.modal-link:hover{background:#1557b0;transform:translateY(-1px)}

@media(max-width:600px){.grid{grid-template-columns:1fr}.header h1{font-size:18px}}
</style>
</head>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">

</div>

const EXAM_URLS = {
  '2026执法': 'https://spa.fenbi.com/ti/exam/exercise/1_1_3p82gjc?routecs=xingce',
  '2026地市': 'https://spa.fenbi.com/ti/exam/exercise/1_1_3p82gjc?routecs=xingce',
  '2026副省': 'https://spa.fenbi.com/ti/exam/exercise/1_1_3p82gjc?routecs=xingce',
};

const ORDER = {
  guokao: ['2026执法','2026地市','2026副省','2025执法','2025地市','2025副省','2024执法','2024地市','2024副省','2023执法','2023地市','2023副省','2022执法','2022地市','2022副省'],
  jiangsu: ['2025江苏A','2025江苏B','2025江苏C','2024江苏A','2024江苏B','2024江苏C','2023江苏A','2023江苏B','2022江苏A','2022江苏B','2022江苏C','2021江苏A','2021江苏B','2021江苏C','2020江苏C']
};

let currentCat='all', currentKey=null;

function getPapers(){
  if(currentCat==='all') return [...ORDER.guokao,...ORDER.jiangsu];
  return ORDER[currentCat];
}

function switchCat(cat){
  currentCat=cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.textContent === (cat==='all'?'全部':cat==='guokao'?'国考':'江苏')));
  buildTabs();
}

function buildTabs(){
  const tabs=document.getElementById('paperTabs');
  const papers=getPapers();
  const groups={};
  papers.forEach(k=>{const yr=k.match(/^\d{4}/)[0];if(!groups[yr])groups[yr]=[];groups[yr].push(k)});
  tabs.innerHTML='';
  Object.entries(groups).reverse().forEach(([yr,keys])=>{
    const gDiv=document.createElement('div');gDiv.className='year-group';
    const lbl=document.createElement('div');lbl.className='year-label';lbl.textContent=yr;gDiv.appendChild(lbl);
    keys.forEach(k=>{
      const tab=document.createElement('span');tab.className='paper-tab';
      const short=k.replace('2025江苏A','25A').replace('2025江苏B','25B').replace('2025江苏C','25C').replace('2024江苏A','24A').replace('2024江苏B','24B').replace('2024江苏C','24C').replace('2023江苏A','23A').replace('2023江苏B','23B').replace('2022江苏A','22A').replace('2022江苏B','22B').replace('2022江苏C','22C').replace('2021江苏A','21A').replace('2021江苏B','21B').replace('2021江苏C','21C').replace('2020江苏C','20C').replace('2026','26').replace('2025','25').replace('2024','24').replace('2023','23').replace('2022','22');
      tab.textContent=short;tab.onclick=()=>switchPaper(k);gDiv.appendChild(tab);
    });tabs.appendChild(gDiv);
  });
  if(papers.length>0) switchPaper(papers[0]);
}

function switchPaper(key){
  currentKey=key;
  document.querySelectorAll('.paper-tab').forEach(t => {
    const s=t.textContent.replace('25A','2025江苏A').replace('25B','2025江苏B').replace('25C','2025江苏C').replace('24A','2024江苏A').replace('24B','2024江苏B').replace('24C','2024江苏C').replace('23A','2023江苏A').replace('23B','2023江苏B').replace('22A','2022江苏A').replace('22B','2022江苏B').replace('22C','2022江苏C').replace('21A','2021江苏A').replace('21B','2021江苏B').replace('21C','2021江苏C').replace('20C','2020江苏C').replace('26','2026').replace('25','2025').replace('24','2024').replace('23','2023').replace('22','2022');
    t.classList.toggle('active', s===key);
  });
  renderContent(key);
}

function renderContent(key){
  const area=document.getElementById('contentArea');
  const data=DATA[key]||{items:[]};
  const keyword=document.getElementById('searchInput').value.trim().toLowerCase();

  let html=`<div class="paper-title">${key}<span>${data.items.length||0}题</span></div>`;

  if(data.items.length===0){
    html+='<div class="empty">📭 待提取题型数据</div>';
  }else{
    const typeCount={};
    data.items.forEach(item=>{const t=item.split('+')[0].trim();typeCount[t]=(typeCount[t]||0)+1;});
    const topTypes=Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
    html+='<div class="stats"><div class="stat-item">📝 总题数 <strong>'+data.items.length+'</strong></div><div class="stat-item">🔝 ';
    topTypes.forEach(([t,c])=>{html+=`<span class="tag">${t}×${c}</span>`;});
    html+='</div></div><div class="grid">';
    data.items.forEach((item,i)=>{
      const hidden=keyword&&!item.toLowerCase().includes(keyword)?' hidden':'';
      html+=`<div class="card${hidden}" onclick="openDetail('${key}',${i})"><div class="card-num">${i+1}</div><div class="card-text">${item}</div></div>`;
    });
    html+='</div>';
  }
  area.innerHTML=html;
}

function openDetail(key, idx){
  const data=DATA[key];
  if(!data||!data.items[idx]) return;
  const item=data.items[idx];
  const examUrl=EXAM_URLS[key]||'https://www.fenbi.com/spa/tiku/guide/realTest/xingce/xingce';
  const modal=document.getElementById('modalContent');
  modal.innerHTML=`
    <div class="modal-header">${key} · 第${idx+1}题</div>
    <div class="modal-info">
      <span class="modal-tag tag-type">📋 ${item}</span>
    </div>
    <div class="modal-section">
      <h3>📝 题型分析</h3>
      <p>此题属于<strong>${item}</strong>类型，位于${key}资料分析部分第${idx+1}题。</p>
      <p style="margin-top:12px;color:#888;font-size:13px">答案解析需在粉笔官网查看。点击下方按钮跳转至粉笔试卷页面。</p>
    </div>
    <a href="${examUrl}" target="_blank" class="modal-link" rel="noopener">🔗 在粉笔查看完整试卷</a>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

function filterCards(){
  if(currentKey) renderContent(currentKey);
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('modalOverlay').classList.contains('show')){
    if(e.key==='Escape') closeModal();
    return;
  }
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    const papers=getPapers();const idx=papers.indexOf(currentKey);
    const next=e.key==='ArrowRight'?Math.min(idx+1,papers.length-1):Math.max(idx-1,0);
    if(next!==idx) switchPaper(papers[next]);
  }
});

buildTabs();
</script>
</body>
</html>
